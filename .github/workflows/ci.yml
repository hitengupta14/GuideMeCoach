name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install (web)
        run: npm ci

      - name: Lint (web)
        run: npm run lint

      - name: Build (web)
        run: npm run build

      - name: Smoke checks
        run: npm run smoke

      - name: Install (mobile)
        working-directory: mobile
        run: npm ci

      - name: Lint (mobile)
        working-directory: mobile
        run: npm run lint

      - name: Typecheck (mobile)
        working-directory: mobile
        run: npm run type-check

